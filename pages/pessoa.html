<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"




<meta
name="theme-color"
content="#091D1C"




<title>Pessoa — Guia Turístico de Andrelândia</title>

<link rel="stylesheet" href="../styles/pessoa.css" >

<!-- ROBOTO -->

<link rel="preconnect" href="https://fonts.googleapis.com" >

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" >

</head>

<body>

<main class="pessoa-page">

<!-- =====================================================
     CABEÇALHO
====================================================== -->

<header class="pessoa-header">

  <button
    class="back-button"
    type="button"
    onclick="voltarPagina()"
    aria-label="Voltar"
  >

    <img
      src="../img/icones/seta.png"
      alt=""
    >

  </button>


  <div class="pessoa-header-title">

    <span id="categoriaPessoa">
      ARTISTA
    </span>

    <h1 id="nomePessoa">
      Carregando...
    </h1>

  </div>

</header>


<!-- =====================================================
     APRESENTAÇÃO
====================================================== -->

<section class="pessoa-apresentacao">


  <!-- FOTO -->

  <div class="pessoa-capa">

    <img
      id="fotoPessoa"
      src="../img/sem-foto.png"
      alt=""
    >


    <button
      class="fullscreen-button"
      type="button"
      onclick="abrirVisualizador(document.getElementById('fotoPessoa').src)"
      aria-label="Abrir foto em tela cheia"
    >

      ⛶

    </button>

  </div>


  <!-- INFORMAÇÕES -->

  <div class="pessoa-introducao">


    <span
      id="categoriaPessoaTexto"
      class="pessoa-categoria"
    >
      ARTISTA
    </span>


    <h2 id="tituloPessoa">
      Carregando...
    </h2>


    <p
      id="descricaoPessoa"
      class="pessoa-descricao"
    >
      Carregando...
    </p>


    <!-- INSTAGRAM -->

    <a
      id="instagramPessoa"
      class="instagram-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display: none;"
    >

      <span class="instagram-button-icon">

        <img
          src="../img/icones/instagram.png"
          alt=""
        >

      </span>


      <span class="instagram-button-text">
        Instagram
      </span>

    </a>


    <!-- =================================================
         EXCLUSÃO DO PRÓPRIO PERFIL
    ================================================== -->

    <button
      id="botaoExcluirPerfil"
      class="botao-excluir-perfil"
      type="button"
      onclick="excluirMeuPerfil()"
      style="display: none;"
    >

      <span class="botao-excluir-perfil-icone">
        ×
      </span>

      <span>
        Excluir meu perfil
      </span>

    </button>

    <button
      id="botaoEditarPerfil"
      class="botao-editar-perfil"
      type="button"
      onclick="abrirEditorPerfil()"
      style="display: none;"
    >
      <span>Editar meu perfil</span>
    </button>


  </div>

</section>


<!-- =====================================================
     SOBRE
====================================================== -->

<section class="sobre-pessoa">

  <div class="section-heading">

    <span>
      CONHEÇA
    </span>

    <h2>
      Sobre
    </h2>

  </div>


  <p id="sobrePessoa">
    Carregando...
  </p>

</section>


<!-- =====================================================
     GALERIA
====================================================== -->

<section class="galeria-pessoa">

  <div class="section-heading">

    <span>
      MOMENTOS
    </span>

    <h2>
      Galeria
    </h2>

  </div>


  <div
    id="galeriaPessoa"
    class="galeria-grid"
  ></div>

</section>

</main>

<!-- ======================================================= VISUALIZADOR DE FOTO ======================================================== -->

<div id="photoViewer" class="photo-viewer" >

<button
  class="close-viewer"
  type="button"
  onclick="fecharVisualizador()"
  aria-label="Fechar"
>

  ×

</button>


<img
  id="viewerImage"
  src=""
  alt=""
>

</div>

<div id="modalEditarPerfil" class="modal-editar-perfil" style="display: none;" aria-hidden="true">
  <div class="editor-perfil-admin">
    <div class="editor-comercio-topo">
      <div>
        <span>EDITANDO PERFIL</span>
        <h2>Editar meu perfil</h2>
      </div>
      <button type="button" class="editor-botao-fechar" onclick="fecharEditorPerfil()">Fechar</button>
    </div>

    <form id="formEditarPerfil" class="editor-perfil-campos">
      <div class="editor-campo">
        <label for="editarPessoaNome">Nome</label>
        <input id="editarPessoaNome" type="text" maxlength="100" required>
      </div>
      <div class="editor-campo">
        <label for="editarPessoaCategoria">Categoria</label>
        <input id="editarPessoaCategoria" type="text" maxlength="80">
      </div>
      <div class="editor-campo editor-campo-largo">
        <label for="editarPessoaInstagram">Instagram</label>
        <input id="editarPessoaInstagram" type="text" maxlength="150" placeholder="@seuperfil">
      </div>
      <div class="editor-campo editor-campo-largo">
        <label for="editarPessoaDescricao">Descrição</label>
        <textarea id="editarPessoaDescricao" rows="4" maxlength="1000"></textarea>
      </div>
      <div class="editor-campo editor-campo-largo">
        <label for="editarPessoaSobre">Sobre</label>
        <textarea id="editarPessoaSobre" rows="5" maxlength="1500"></textarea>
      </div>
      <div class="editor-imagens editor-campo-largo">
        <div class="editor-imagens-cabecalho">
          <div><label>Imagens</label><small>Até 4 imagens. A primeira será a principal.</small></div>
          <span id="contadorImagensPerfil" class="editor-contador-imagens">0/4</span>
        </div>
        <div id="imagensPerfilAtuais" class="editor-imagens-lista"></div>
        <label for="editarPessoaImagens" class="editor-botao-imagem">+ Adicionar imagens</label>
        <input id="editarPessoaImagens" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <small class="editor-imagens-ajuda">JPG, PNG ou WEBP · máximo 5 MB por imagem</small>
      </div>
      <div id="mensagemEditarPerfil" class="mensagem-editar-perfil editor-campo-largo"></div>
      <div class="editor-comercio-acoes editor-campo-largo">
        <button type="button" class="editor-botao-cancelar" onclick="fecharEditorPerfil()">Cancelar</button>
        <button type="submit" class="editor-botao-salvar" id="salvarEdicaoPerfil">Salvar alterações</button>
      </div>
    </form>
  </div>
</div>

<!-- =======================================================
     SCRIPTS
======================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/login.js"></script>

<script src="../js/pessoa.js"></script>

</body>
</html>
