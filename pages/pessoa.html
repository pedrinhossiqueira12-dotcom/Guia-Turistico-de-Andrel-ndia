<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#091D1C"
  >

  <title>Pessoa — Guia Turístico de Andrelândia</title>

  <link
    rel="stylesheet"
    href="../styles/pessoa.css"
  >

  <!-- ROBOTO -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>

<main class="pessoa-page">

  <!-- =====================================================
       CABEÇALHO
  ====================================================== -->

  <header class="pessoa-header">

    <button
      class="back-button"
      type="button"
      onclick="voltarPagina()"
      aria-label="Voltar"
    >

      <img
        src="../img/icones/seta.png"
        alt=""
      >

    </button>


    <div class="pessoa-header-title">

      <span id="categoriaPessoa">
        ARTISTA
      </span>

      <h1 id="nomePessoa">
        Carregando...
      </h1>

    </div>

  </header>


  <!-- =====================================================
       APRESENTAÇÃO
  ====================================================== -->

  <section class="pessoa-apresentacao">

    <!-- FOTO -->

    <div class="pessoa-capa">

      <img
        id="fotoPessoa"
        src=""
        alt=""
      >

      <button
        class="fullscreen-button"
        type="button"
        onclick="abrirFotoTelaCheia()"
        aria-label="Abrir foto em tela cheia"
      >
        ⛶
      </button>

    </div>


    <!-- INFORMAÇÕES -->

    <div class="pessoa-introducao">

      <span
        id="categoriaPessoaTexto"
        class="pessoa-categoria"
      >
        ARTISTA
      </span>


      <h2 id="tituloPessoa">
        Carregando...
      </h2>


      <p
        id="descricaoPessoa"
        class="pessoa-descricao"
      >
        Carregando...
      </p>


      <!-- INSTAGRAM -->

      <a
        id="instagramPessoa"
        class="instagram-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="instagram-button-icon">

          <img
            src="../img/icones/instagram.png"
            alt=""
          >

        </span>


        <span class="instagram-button-text">
          Instagram
        </span>


        <span class="instagram-button-arrow">
          →
        </span>

      </a>

    </div>

  </section>


  <!-- =====================================================
       SOBRE
  ====================================================== -->

  <section class="sobre-pessoa">

    <div class="section-heading">

      <span>
        CONHEÇA
      </span>

      <h2>
        Sobre
      </h2>

    </div>


    <p id="sobrePessoa">
      Carregando...
    </p>

  </section>


  <!-- =====================================================
       GALERIA
  ====================================================== -->

  <section class="galeria-pessoa">

    <div class="section-heading">

      <span>
        MOMENTOS
      </span>

      <h2>
        Galeria
      </h2>

    </div>


    <div
      id="galeriaPessoa"
      class="galeria-grid"
    ></div>

  </section>

</main>


<!-- =======================================================
     VISUALIZADOR DE FOTO
======================================================== -->

<div
  id="photoViewer"
  class="photo-viewer"
>

  <button
    class="close-viewer"
    type="button"
    onclick="fecharFotoTelaCheia()"
    aria-label="Fechar"
  >
    ×
  </button>


  <img
    id="viewerImage"
    src=""
    alt=""
  >

</div>


<!-- =======================================================
     SCRIPT
======================================================== -->

<script src="../js/pessoa.js"></script>

</body>

</html>
