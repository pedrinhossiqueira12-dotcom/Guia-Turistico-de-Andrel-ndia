<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#091D1C"
  >

  <title>Local — Guia Turístico de Andrelândia</title>

  <link
    rel="stylesheet"
    href="../styles/local.css"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- FONTES -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>

<main class="local-page">


  <!-- =====================================================
       CABEÇALHO
  ====================================================== -->

  <header class="local-header">

    <button
      class="back-button"
      type="button"
      onclick="voltarPagina()"
      aria-label="Voltar"
    >

      <img
        class="home-button"
        src="../img/icones/seta.png"
        alt=""
      >

    </button>


    <div class="local-header-title">

      <span id="categoriaLocal">
        LOCAL
      </span>

      <h1 id="nomeLocal">
        Carregando...
      </h1>

    </div>

  </header>



  <!-- =====================================================
       GALERIA
  ====================================================== -->

  <section class="local-gallery">

    <div class="main-photo-container">

      <img
        id="fotoPrincipal"
        class="main-photo"
        src=""
        alt=""
      >

      <button
        class="fullscreen-button"
        type="button"
        onclick="abrirFotoTelaCheia()"
        aria-label="Abrir foto em tela cheia"
      >
        ⛶
      </button>

    </div>


    <div
      id="miniaturas"
      class="thumbnails"
    ></div>

  </section>



  <!-- =====================================================
       CONTEÚDO
  ====================================================== -->

  <section class="content-section">


    <div class="section-block">

      <h2>
        Sobre o local
      </h2>

      <p id="descricaoLocal"></p>

    </div>


    <div class="section-block">

      <h2>
        História
      </h2>

      <p id="historiaLocal"></p>

    </div>


    <div class="section-block">

      <h2>
        Curiosidades
      </h2>

      <p id="curiosidadesLocal"></p>

    </div>


  </section>



  <!-- =====================================================
       INFORMAÇÕES
  ====================================================== -->

  <section class="local-info-grid">


    <!-- HORÁRIO -->

    <div class="info-card">

      <div class="info-icon">

        <img
          src="../img/icones/tempo.png"
          alt="Horário"
        >

      </div>


      <div class="info-content">

        <span class="info-label">
          HORÁRIO
        </span>

        <div
          id="horarioLocal"
          class="info-value"
        >
          Não informado
        </div>

      </div>

    </div>



    <!-- ENDEREÇO -->

    <div class="info-card">

      <div class="info-icon">

        <img
          src="../img/icones/marcador.png"
          alt="Endereço"
        >

      </div>


      <div class="info-content">

        <span class="info-label">
          ENDEREÇO
        </span>

        <div
          id="enderecoLocal"
          class="info-value"
        >
          Não informado
        </div>

      </div>

    </div>


  </section>



  <!-- =====================================================
       CONTATOS
  ====================================================== -->

  <div class="contatos-local">

  <a
    id="whatsappLocal"
    class="contato-local"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    style="display:none;"
  >
    <img
      src="../img/icones/whatsapp.png"
      alt="WhatsApp"
    >

    <span id="whatsappNome">
      WhatsApp
    </span>
  </a>


  <a
    id="instagramLocal"
    class="contato-local"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    style="display:none;"
  >
    <img
      src="../img/icones/instagram2.png"
      alt="Instagram"
    >

    <span id="instagramNome">
      Instagram
    </span>
  </a>

</div>


  <!-- =====================================================
       MAPA
  ====================================================== -->

  <section class="local-map-section">


    <div class="section-heading">

      <span>
        LOCALIZAÇÃO
      </span>

      <h2>
        Onde fica?
      </h2>

    </div>


    <div
      id="localMap"
      class="local-map"
    ></div>


    <a
      id="comoChegar"
      class="directions-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >

      Como chegar

      <span>
        →
      </span>

    </a>


  </section>



  <!-- =====================================================
       COMENTÁRIOS
  ====================================================== -->

  <section class="comments-section">


    <div class="section-title">

      <span>
        EXPERIÊNCIAS
      </span>

      <h2>
        Comentários
      </h2>

    </div>


    <div
      id="listaComentarios"
      class="comments-list"
    >

      <div class="empty-comments">
        Ainda não há comentários. Seja o primeiro a comentar!
      </div>

    </div>


    <div class="comment-form">


      <input
        type="text"
        id="nomeComentario"
        placeholder="Seu nome"
        maxlength="40"
      >


      <textarea
        id="textoComentario"
        placeholder="Conte como foi sua experiência..."
        maxlength="500"
        rows="4"
      ></textarea>


      <button
        type="button"
        id="publicarComentario"
      >
        Publicar comentário
      </button>


    </div>


  </section>


</main>



<!-- =======================================================
     VISUALIZADOR DE FOTO
======================================================== -->

<div
  id="photoViewer"
  class="photo-viewer"
>

  <button
    class="close-viewer"
    type="button"
    onclick="fecharFotoTelaCheia()"
    aria-label="Fechar"
  >

    ×

  </button>


  <img
    id="viewerImage"
    src=""
    alt=""
  >

</div>



<!-- =======================================================
     SCRIPTS
======================================================== -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>

<script
  src="../js/local.js"
></script>


</body>

</html>
