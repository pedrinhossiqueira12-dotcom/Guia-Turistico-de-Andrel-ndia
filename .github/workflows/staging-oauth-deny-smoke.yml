name: STAGING OAuth fail-closed HTTP smoke (no credentials)

on:
  push:
    branches:
      - fix/staging-oauth-qa-guard-20261026
    paths:
      - .github/workflows/staging-oauth-deny-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-deny-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Callback must reject external OAuth error without state
        shell: bash
        run: |
          set -euo pipefail
          url='https://jbttwihctuibchhcyqtl.supabase.co/functions/v1/mercadopago-oauth-callback?error=access_denied'
          code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$url")"
          echo "OAuth callback denial HTTP: $code"
          test "$code" = '400'

      - name: OAuth starter must reject unauthenticated POST
        shell: bash
        run: |
          set -euo pipefail
          url='https://jbttwihctuibchhcyqtl.supabase.co/functions/v1/catalogo-oauth-qa-iniciar'
          code="$(curl --silent --show-error --max-time 20 --request POST --header 'content-type: application/json' --data '{"acao":"iniciar_conexao_qa","comercio_id":"asaas-homologacao"}' --output /dev/null --write-out '%{http_code}' "$url")"
          echo "Unauthenticated starter HTTP: $code"
          test "$code" = '401'

      - name: After QA closeout the starter must be disabled (public-key-only returns 503)
        shell: bash
        run: |
          set -euo pipefail
          key="$(node -e 'const fs=require("node:fs");const t=fs.readFileSync("js/catalogo-oauth-qa.js","utf8");const m=t.match(/const STAGING_PUBLISHABLE_KEY = "(sb_publishable_[A-Za-z0-9_-]+)";/);if(!m)process.exit(1);process.stdout.write(m[1]);')"
          code="$(curl --silent --show-error --max-time 20 --request POST --header "apikey: $key" --header "authorization: Bearer $key" --header 'content-type: application/json' --data '{"acao":"iniciar_conexao_qa","comercio_id":"asaas-homologacao"}' --output /dev/null --write-out '%{http_code}' 'https://jbttwihctuibchhcyqtl.supabase.co/functions/v1/catalogo-oauth-qa-iniciar')"
          echo "Starter with public project key HTTP: $code"
          # QA homologation is complete: MP_OAUTH_QA_ENABLED must remain false.
          # 503 is emitted BEFORE checking user authentication when QA is disabled.
          # 401 would mean the QA starter is ready, so reject it in this closeout check.
          test "$code" = '503'

      - name: Configuration diagnostic must reject public-key-only caller
        shell: bash
        run: |
          set -euo pipefail
          key="$(node -e 'const fs=require("node:fs");const t=fs.readFileSync("js/catalogo-oauth-qa.js","utf8");const m=t.match(/const STAGING_PUBLISHABLE_KEY = "(sb_publishable_[A-Za-z0-9_-]+)";/);if(!m)process.exit(1);process.stdout.write(m[1]);')"
          code="$(curl --silent --show-error --max-time 20 --request POST --header "apikey: $key" --header "authorization: Bearer $key" --header 'content-type: application/json' --data '{"acao":"verificar_configuracao_qa","comercio_id":"asaas-homologacao"}' --output /dev/null --write-out '%{http_code}' 'https://jbttwihctuibchhcyqtl.supabase.co/functions/v1/catalogo-oauth-qa-iniciar')"
          echo "Anonymous QA configuration diagnostic HTTP: $code"
          test "$code" = '401'

      - name: Cloudflare branch preview must serve the isolated STAGING login
        shell: bash
        run: |
          set -euo pipefail
          origin='https://fix-staging-oauth-qa-guard-2.guia-turistico-de-andrelandia.pages.dev'
          page="$(mktemp)"
          script="$(mktemp)"
          trap 'rm -f "$page" "$script"' EXIT
          curl --fail --location --proto-redir =https --silent --show-error --retry 3 --retry-delay 2 --max-time 20 --output "$page" "$origin/pages/catalogo-oauth-qa.html"
          curl --fail --location --proto-redir =https --silent --show-error --retry 3 --retry-delay 2 --max-time 20 --output "$script" "$origin/js/catalogo-oauth-qa.js"
          echo "HTML bytes: $(wc -c < "$page"); JavaScript bytes: $(wc -c < "$script")"
          grep -q 'id="loginPanel"' "$page" || { echo "Preview missing loginPanel" >&2; exit 1; }
          grep -q 'id="inspectButton"' "$page" || { echo "Preview missing inspectButton" >&2; exit 1; }
          grep -q 'id="connectButton".*disabled' "$page" || { echo "Preview missing disabled connectButton" >&2; exit 1; }
          grep -q 'catalogo-oauth-qa.js' "$page" || { echo "Preview missing QA script tag" >&2; exit 1; }
          grep -q 'https://jbttwihctuibchhcyqtl.supabase.co' "$script" || { echo "Preview script missing STAGING reference" >&2; exit 1; }
          grep -q 'verificar_configuracao_qa' "$script" || { echo "Preview script missing authenticated preflight" >&2; exit 1; }
          if grep -q 'xdmbkflufsfqziixzpxc' "$script"; then
            echo 'Production Supabase reference found in QA frontend' >&2
            exit 1
          fi
          echo 'QA branch preview HTML and JS available without financial endpoints'
