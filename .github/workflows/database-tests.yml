name: Database tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/validacao-pagamentos/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - "logic/finalizacao-marketplace-2026-10-07"

jobs:
  financial-unit-tests:
    name: Financial snapshot tests (Deno, isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test financial snapshots without database access
        run: deno test --no-check --allow-read=supabase/functions supabase/functions/tests/catalogo-financeiro.test.ts supabase/functions/tests/catalogo-checkouts-contract.test.ts supabase/functions/tests/catalogo-seguranca-pagamentos.test.ts

  legacy-baseline-smoke:
    name: Legacy baseline and first migration (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: catalogo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalogo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: catalogo_ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable database connection
        run: |
          test "$PGHOST" = localhost
          test "$PGPORT" = 5432
          test "$PGDATABASE" = catalogo_ci
          test "$PGUSER" = postgres
          test -z "${DATABASE_URL:-}"
          test -z "${PGSERVICE:-}"
          test -z "${PGHOSTADDR:-}"
          test -z "${PGOPTIONS:-}"
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), inet_server_addr() IS NOT NULL" | grep -Fx 'catalogo_ci|t'
      - name: Create minimal Supabase Auth test doubles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $auth_test$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $auth_test$;
          SQL
      - name: Ensure baseline rejects missing opt-in
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline/legacy-public-tables.sql > /tmp/baseline-no-opt-in.log 2>&1; then
            echo "ERROR: baseline accepted missing opt-in"
            exit 1
          fi
          grep -q "Baseline legado exige Supabase local descartavel" /tmp/baseline-no-opt-in.log
      - name: Ensure baseline rejects wrong database even with opt-in
        run: |
          if psql -d postgres -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_baseline = 'enabled'" -f supabase/tests/baseline/legacy-public-tables.sql > /tmp/baseline-wrong-db.log 2>&1; then
            echo "ERROR: baseline accepted wrong database"
            exit 1
          fi
          grep -q "Baseline legado exige Supabase local descartavel" /tmp/baseline-wrong-db.log
          psql -d postgres -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.avaliacoes') IS NULL AND to_regclass('public.cadastros_comercios') IS NULL AND to_regclass('public.mural_cadastros') IS NULL" | grep -Fx t
      - name: Apply baseline and actual first migration
        run: |
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_baseline = 'enabled'" -f supabase/tests/baseline/legacy-public-tables.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002233841_publication_metadata_reversible_archive_20261002.sql
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.cadastros_comercios WHERE local_id = 'pedrox-do-grau' AND status = 'aprovado'" | grep -Fx 1
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.comercios_publicados" | grep -Fx 139
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM pg_policies WHERE schemaname = 'public' AND tablename = 'mural_cadastros' AND policyname = 'Mural — público vê ativos'" | grep -Fx 1
      - name: Verify legacy table security and synthetic data
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF (SELECT count(*) FROM public.cadastros_comercios) <> 1 THEN
              RAISE EXCEPTION 'Expected exactly one synthetic registration';
            END IF;
            IF (SELECT count(*) FROM public.avaliacoes) <> 0
               OR (SELECT count(*) FROM public.mural_cadastros) <> 0 THEN
              RAISE EXCEPTION 'Legacy baseline unexpectedly contains personal records';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class
              WHERE oid IN (
                'public.avaliacoes'::regclass,
                'public.cadastros_comercios'::regclass,
                'public.mural_cadastros'::regclass,
                'public.comercios_publicados'::regclass
              )
              AND NOT relrowsecurity
            ) THEN
              RAISE EXCEPTION 'RLS must be enabled on all legacy public tables';
            END IF;
            IF (SELECT count(*) FROM pg_policies
                WHERE schemaname='public' AND tablename='mural_cadastros'
                  AND policyname='Mural — público vê ativos') <> 1 THEN
              RAISE EXCEPTION 'Expected exactly one public mural policy';
            END IF;
          END $verify$;
          SQL
      - name: Verify first migration can be reapplied safely
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002233841_publication_metadata_reversible_archive_20261002.sql
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.comercios_publicados" | grep -Fx 139
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM public.cadastros_comercios WHERE local_id = 'pedrox-do-grau' AND status = 'aprovado'" | grep -Fx 1
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT COUNT(*) FROM pg_policies WHERE schemaname = 'public' AND tablename = 'mural_cadastros' AND policyname = 'Mural — público vê ativos'" | grep -Fx 1

  catalogo-initial-migration-smoke:
    name: Catalogo migration with isolated Storage stubs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: catalogo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalogo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: catalogo_ci
    steps:
      - uses: actions/checkout@v4
      - name: Check disposable target
        run: |
          test "$PGHOST" = localhost
          test "$PGDATABASE" = catalogo_ci
          test -z "${DATABASE_URL:-}"
          test -z "${PGSERVICE:-}"
          test -z "${PGHOSTADDR:-}"
          test -z "${PGOPTIONS:-}"
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database()" | grep -Fx catalogo_ci
      - name: Prepare minimal Auth and Storage doubles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $auth_test$
            SELECT NULLIF(current_setting('request.jwt.claim.sub',true),'')::uuid
          $auth_test$;
          CREATE SCHEMA storage;
          CREATE TABLE storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          CREATE TABLE storage.objects (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text NOT NULL REFERENCES storage.buckets(id),
            name text NOT NULL
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;
          CREATE FUNCTION storage.extension(p_name text) RETURNS text
          LANGUAGE sql IMMUTABLE AS $ext$ SELECT split_part(p_name,'.',array_length(string_to_array(p_name,'.'),1)) $ext$;
          CREATE FUNCTION storage.foldername(p_name text) RETURNS text[]
          LANGUAGE sql IMMUTABLE AS $folder$ SELECT (string_to_array(p_name,'/'))[1:greatest(array_length(string_to_array(p_name,'/'),1)-1,0)] $folder$;
          SQL
      - name: Apply legacy baseline and first real migration
        run: |
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_baseline = 'enabled'" -f supabase/tests/baseline/legacy-public-tables.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261002233841_publication_metadata_reversible_archive_20261002.sql
      - name: Apply real catalogo digital migration (without scheduling migration)
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003013323_catalogo_digital_20261003000000.sql
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT public, file_size_limit, array_to_string(allowed_mime_types, ',') FROM storage.buckets WHERE id='catalogos'" | grep -Fx 't|5242880|image/webp,image/jpeg,image/png'
          psql -v ON_ERROR_STOP=1 -c "UPDATE storage.buckets SET file_size_limit = 4194304 WHERE id = 'catalogos'"
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003013323_catalogo_digital_20261003000000.sql
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT file_size_limit FROM storage.buckets WHERE id='catalogos'" | grep -Fx 4194304
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT reloptions @> ARRAY['security_invoker=true']::text[] FROM pg_class WHERE oid='public.catalogo_publicado'::regclass" | grep -Fx t
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT has_table_privilege('anon','public.catalogo_assinaturas','SELECT')" | grep -Fx f
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT has_table_privilege('authenticated','public.catalogo_assinaturas','SELECT')" | grep -Fx f
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT has_table_privilege('anon','public.catalogo_produtos','INSERT')" | grep -Fx f
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_trigger WHERE tgname IN ('catalogos_atualizado_em','catalogo_categorias_atualizado_em','catalogo_produtos_atualizado_em') AND NOT tgisinternal" | grep -Fx 3
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM storage.buckets WHERE id='catalogos'" | grep -Fx 1
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_policies WHERE schemaname='storage' AND tablename='objects' AND policyname='catalogos_proprietario_upload_ativo'" | grep -Fx 1
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_class WHERE oid IN ('public.catalogos'::regclass,'public.catalogo_assinaturas'::regclass,'public.catalogo_categorias'::regclass,'public.catalogo_produtos'::regclass) AND relrowsecurity" | grep -Fx 4

      - name: Apply real migrations for news, payments, profiles and marketplace (isolated only)
        run: |
          test "$PGHOST" = localhost
          test "$PGDATABASE" = catalogo_ci
          test -z "${DATABASE_URL:-}"
          test -z "${PGSERVICE:-}"
          test -z "${PGHOSTADDR:-}"
          test -z "${PGOPTIONS:-}"
          # Cron/Vault scheduling migration is intentionally excluded:
          # it embeds an endpoint pointing to production. Never execute it here.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003134656_editorial_pagamentos_20261003.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261003140000_catalogo_pagamento_producao.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004003000_perfil_fotos_e_politicas.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004110000_avaliacoes_avatar_url.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261004223000_catalogo_marketplace_pedidos.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261005010000_catalogo_marketplace_oauth.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261005090000_catalogo_pedidos_email.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert_extra_migrations$
          BEGIN
            IF (SELECT count(*) FROM storage.buckets WHERE id IN ('catalogos', 'noticias-eventos', 'perfil-fotos')) <> 3 THEN
              RAISE EXCEPTION 'Expected all three isolated Storage buckets';
            END IF;
            IF (SELECT count(*) FROM pg_class
                WHERE oid IN ('public.conteudos_editoriais'::regclass,
                              'public.catalogo_pagamentos'::regclass,
                              'public.catalogo_recebedores'::regclass,
                              'public.catalogo_pedidos'::regclass,
                              'public.catalogo_pedido_itens'::regclass,
                              'public.catalogo_oauth_estados'::regclass)
                  AND relrowsecurity) <> 6 THEN
              RAISE EXCEPTION 'Some marketplace or editorial tables have RLS disabled';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_schema = 'public' AND table_name = 'avaliacoes'
                             AND column_name = 'avatar_url')
               OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                              WHERE table_schema = 'public' AND table_name = 'catalogo_pedidos'
                                AND column_name = 'cliente_email') THEN
              RAISE EXCEPTION 'Expected legacy avatar and order email columns';
            END IF;
            IF has_table_privilege('anon','public.catalogo_pedidos','SELECT')
               OR has_table_privilege('authenticated','public.catalogo_pagamentos','SELECT')
               OR has_table_privilege('anon','public.catalogo_oauth_estados','SELECT') THEN
              RAISE EXCEPTION 'Payment, order or OAuth data exposed directly';
            END IF;
            IF to_regclass('cron.job') IS NOT NULL THEN
              RAISE EXCEPTION 'Unexpected cron scheduling in isolated database';
            END IF;
          END $assert_extra_migrations$;
          SQL

      - name: Reject RLS scenarios without explicit opt-in
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/isolated/catalogo-rls-postgres.sql > /tmp/catalogo-rls-no-opt-in.log 2>&1; then
            echo "ERROR: behavioral security fixture accepted missing opt-in"
            exit 1
          fi
          grep -q "Teste RLS do catálogo permitido somente no catalogo_ci" /tmp/catalogo-rls-no-opt-in.log
      - name: Exercise real catalog permissions for owner, stranger and anonymous visitor
        run: |
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_scenario = 'enabled'" -f supabase/tests/isolated/catalogo-rls-postgres.sql

      - name: Reject payment regression fixture without explicit opt-in
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/isolated/catalogo-assinaturas-pagamentos-postgres.sql > /tmp/catalogo-payments-no-opt-in.log 2>&1; then
            echo "ERROR: payments fixture accepted missing opt-in"
            exit 1
          fi
          grep -q "Fixture de pagamentos exige catalogo_ci descartavel" /tmp/catalogo-payments-no-opt-in.log
      - name: Test real subscription-payment RPC and delayed/refunded events
        run: |
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_payments = 'enabled'" -f supabase/tests/isolated/catalogo-assinaturas-pagamentos-postgres.sql

  complete-chain-postgres-isolated:
    name: All financial migrations except remote scheduling (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: catalogo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalogo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: catalogo_ci
    steps:
      - uses: actions/checkout@v4
      - name: Enforce ephemeral target without external cron extensions
        run: |
          test "$PGHOST" = localhost
          test "$PGPORT" = 5432
          test "$PGUSER" = postgres
          test "$PGDATABASE" = catalogo_ci
          test -z "${DATABASE_URL:-}"
          test -z "${PGSERVICE:-}"
          test -z "${PGHOSTADDR:-}"
          test -z "${PGOPTIONS:-}"
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), inet_server_addr() IS NOT NULL" | grep -Fx 'catalogo_ci|t'
          # Scheduled jobs must be unavailable in this isolated database;
          # the second migration embeds a PRODUCTION URL and is NEVER run here.
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM pg_available_extensions WHERE name IN ('pg_cron','pg_net')" | grep -Fx 0
      - name: Refuse unsafe Auth/Storage bootstrap without opt-in
        run: |
          if psql -v ON_ERROR_STOP=1 -f supabase/tests/baseline/catalogo-ci-auth-storage.sql > /tmp/auth-no-opt-in.log 2>&1; then
            echo 'ERROR: mock bootstrap ignored guard'
            exit 1
          fi
          grep -q 'Mocks Auth/Storage exigem catalogo_ci vazio' /tmp/auth-no-opt-in.log
      - name: Build synthetic legacy baseline in empty local database
        run: |
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_auth_storage = 'enabled'" -f supabase/tests/baseline/catalogo-ci-auth-storage.sql
          psql -v ON_ERROR_STOP=1 -1 -c "SET app.marketplace_test_baseline = 'enabled'" -f supabase/tests/baseline/legacy-public-tables.sql
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM public.cadastros_comercios" | grep -Fx 1
      - name: Apply ordered real SQL migrations without remote scheduler
        run: |
          set -euo pipefail
          count=0
          for migration in supabase/migrations/*.sql; do
            case "$migration" in
              supabase/migrations/20261002235010_schedule_storage_retention_dry_run_20261002.sql)
                echo "SKIPPED intentionally: $migration (contains production URL and schedules remote HTTP)"
                ;;
              supabase/migrations/20261005133000_catalogo_marketplace_test_allowlist.sql)
                # This historical migration INSERTs 'comercio-de-exemplo' and requires
                # an existing catalog. Neither is in the public 139-ID baseline.
                # Supply only synthetic FK data in this isolated service database.
                psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users(id)
          VALUES ('00000000-0000-4000-8000-000000000099');
          INSERT INTO public.comercios_publicados(local_id,status,destaque)
          VALUES ('comercio-de-exemplo','ativo',false);
          INSERT INTO public.catalogos(comercio_id,proprietario_id)
          VALUES ('comercio-de-exemplo','00000000-0000-4000-8000-000000000099');
          SQL
                echo "Applying isolated with synthetic marketplace allowlist seed: $migration"
                psql -v ON_ERROR_STOP=1 -f "$migration"
                count=$((count + 1))
                ;;
              *)
                echo "Applying isolated: $migration"
                psql -v ON_ERROR_STOP=1 -f "$migration"
                count=$((count + 1))
                ;;
            esac
          done
          total=$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)
          test "$count" -eq "$((total - 1))"
          echo "Applied $count of $total real migrations to disposable catalogo_ci."
      - name: Assert final V2 model and 7-percent rounding in actual schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $final_chain$
          DECLARE v_total integer; v_motoboy integer; v_plataforma integer;
          BEGIN
            IF to_regclass('public.catalogo_fluxo_config') IS NULL
               OR to_regclass('public.catalogo_pedidos') IS NULL
               OR to_regclass('public.catalogo_remuneracoes_v2') IS NULL
               OR to_regclass('public.catalogo_lancamentos_financeiros_v2') IS NULL
               OR to_regclass('public.catalogo_fatura_cobrancas') IS NULL
               OR to_regclass('public.catalogo_comissoes_offline') IS NULL THEN
              RAISE EXCEPTION 'Full financial schema was not created by actual migrations';
            END IF;
            IF (SELECT count(*) FROM public.comercios_publicados) < 139
               OR (SELECT count(*) FROM public.catalogo_pedidos) <> 0
               OR (SELECT count(*) FROM public.catalogo_pagamentos) <> 0 THEN
              RAISE EXCEPTION 'Unexpected real-looking data in disposable test database';
            END IF;
            IF (SELECT count(*) FROM pg_extension WHERE extname = 'pg_cron') <> 0
               OR to_regclass('cron.job') IS NOT NULL THEN
              RAISE EXCEPTION 'Isolated database must not have scheduled jobs';
            END IF;
            IF (SELECT count(*) FROM pg_class
                WHERE oid IN ('public.catalogo_pedidos'::regclass,
                              'public.catalogo_remuneracoes_v2'::regclass,
                              'public.catalogo_lancamentos_financeiros_v2'::regclass,
                              'public.catalogo_fatura_cobrancas'::regclass)
                  AND relrowsecurity) <> 4 THEN
              RAISE EXCEPTION 'RLS missing on financial or delivery tables';
            END IF;

            UPDATE public.catalogo_fluxo_config
               SET ativo = true, comercios_piloto = NULL WHERE id = true;
            SELECT (r->>'taxa_total_centavos')::integer,
                   (r->>'taxa_motoboy_centavos')::integer,
                   (r->>'taxa_plataforma_centavos')::integer
            INTO v_total, v_motoboy, v_plataforma
            FROM (SELECT public.catalogo_fluxo_precificar('entrega',101,NULL) AS r) x;
            IF v_total IS DISTINCT FROM 7 OR v_motoboy IS DISTINCT FROM 2
               OR v_plataforma IS DISTINCT FROM 5
               OR v_total <> v_motoboy + v_plataforma THEN
              RAISE EXCEPTION 'Final 7-percent pricing RPC failed for 101 cents';
            END IF;
            IF has_function_privilege('anon',
                'public.catalogo_confirmar_entrega_motoboy(uuid,text,uuid,text)', 'EXECUTE')
               OR has_function_privilege('authenticated',
                'public.catalogo_confirmar_cobranca_fatura(text,text,text,integer,text)', 'EXECUTE')
               THEN
              RAISE EXCEPTION 'Direct payment/delivery access was exposed';
            END IF;
          END $final_chain$;
          SQL

  pricing-postgres-isolated:
    name: Real pricing RPC (isolated PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: catalogo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catalogo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: catalogo_ci
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolated PostgreSQL target
        run: |
          test "$PGHOST" = "localhost"
          test "$PGDATABASE" = "catalogo_ci"
          test "$PGUSER" = "postgres"
          test "$PGPORT" = "5432"
          test -z "${DATABASE_URL:-}"
          test -z "${PGSERVICE:-}"
          test -z "${PGHOSTADDR:-}"
          test -z "${PGOPTIONS:-}"
          psql -v ON_ERROR_STOP=1 -Atqc "SELECT current_database(), inet_server_addr() IS NOT NULL" | grep -Fx 'catalogo_ci|t'
      - name: Assemble test using actual migration RPC
        run: python scripts/validacao-pagamentos/build-isolated-pricing-test.py
      - name: Verify fixture rejects a wrong database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE TABLE IF NOT EXISTS public.catalogo_fluxo_config (id integer)"
          if psql -v ON_ERROR_STOP=1 -d postgres -f /tmp/catalogo-precificacao-ci.sql > /tmp/fixture-guard.log 2>&1; then
            echo "ERROR: fixture executed outside catalogo_ci"
            exit 1
          fi
          grep -q "Fixture financeira exige banco catalogo_ci vazio" /tmp/fixture-guard.log
      - name: Execute PostgreSQL integration checks
        run: |
          psql -v ON_ERROR_STOP=1 -f /tmp/catalogo-precificacao-ci.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/catalogo-constraints-ci.sql

  sql-syntax:
    name: SQL syntax (all migrations and pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast==7.10
      - name: Parse SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          paths = sorted(Path("supabase/migrations").glob("*.sql"))
          paths += sorted(Path("supabase/tests/database").glob("*.sql"))
          paths += sorted(Path("supabase/tests/baseline").glob("*.sql"))
          paths += sorted(Path("supabase/tests/isolated").glob("*.sql"))
          assert paths, "No SQL files found"
          failures = []
          for path in paths:
              try:
                  parse_sql(path.read_text(encoding="utf-8"))
                  print(f"PASS: {path}")
              except Exception as error:
                  failures.append(f"{path}: {error}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Parsed {len(paths)} SQL files successfully (syntax only).")
          PY

  database-tests:
    if: ${{ vars.MARKETPLACE_TEST_BASELINE_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A partial baseline exists, but it is NOT integrated with Supabase reset.
      # Keep gated until full migrations and pgTAP pass in a disposable instance.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db
